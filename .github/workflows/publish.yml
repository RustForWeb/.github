name: Publish

on:
    workflow_call:
        inputs:
            enable-rust:
                description: 'Enable Rust job.'
                type: boolean
                required: true
            enable-typescript:
                description: 'Enable TypeScript job.'
                type: boolean
                required: true
            typescript-registry-github:
                description: 'Publish TypeScript packages to GitHub Packages registry.'
                type: boolean
                required: false
                default: false
            typescript-registry-npm:
                description: 'Publish TypeScript packages to npm registry.'
                type: boolean
                required: false
                default: false

            # Inputs for `actions-rust-lang/setup-rust-toolchain`.
            # https://github.com/actions-rust-lang/setup-rust-toolchain/blob/main/action.yml
            toolchain:
                description: 'Comma-separated list of Rust toolchain specifications. Last version becomes the default. -- see https://rust-lang.github.io/rustup/concepts/toolchains.html#toolchain-specification'
                type: string
                required: false
            target:
                description: 'Target triple to install for this toolchain'
                type: string
                required: false

permissions:
    contents: read
    id-token: write

jobs:
    rust:
        name: Rust
        runs-on: ubuntu-latest
        if: ${{ inputs.enable-rust }}

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Set up Rust toolchain
              uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
              with:
                  toolchain: ${{ inputs.toolchain }}
                  target: ${{ inputs.target }}

            - name: Install Cargo Binary Install
              uses: cargo-bins/cargo-binstall@ead08b90bd7b2e6d81963fb9cf0b7239f66d5db4 # v1.21.0

            - name: Install crates
              run: cargo binstall --force -y cargo-workspaces

            - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
              id: auth

            - name: Publish
              run: cargo workspaces publish --publish-as-is
              env:
                  CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

    typescript:
        name: TypeScript
        runs-on: ubuntu-latest
        if: ${{ inputs.enable-typescript }}

        permissions:
            contents: read
            id-token: write
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 'lts/*'
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Publish to npm
              if: ${{ inputs.typescript-registry-npm }}
              run: npm publish --access public --registry https://registry.npmjs.org --workspaces

            - name: Set up Node.js
              if: ${{ inputs.typescript-registry-github }}
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 'lts/*'
                  cache: 'npm'
                  registry-url: 'https://npm.pkg.github.com'

            - name: Publish to GitHub Packages
              if: ${{ inputs.typescript-registry-github }}
              run: npm publish --access public --registry https://npm.pkg.github.com --workspaces
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
