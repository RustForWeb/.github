name: CI

on:
    pull_request: {}
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    typescript:
        name: TypeScript
        uses: ./.github/workflows/typescript.yml

        permissions:
            contents: read
            packages: read

        with:
            enable-lint: false
            enable-dependencies: false
            enable-test: false

    renovate:
        name: Renovate
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 'lts/*'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Validate Renovate config
              run: npx --package renovate -- renovate-config-validator --strict .github/renovate.json renovate-config.json
